name: CI Pipeline - UNET Inventario

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Compilación del Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore src/backend/InventorySystem.sln

      - name: Compilar solución en modo Release
        run: dotnet build src/backend/InventorySystem.sln --configuration Release --no-restore

  build-frontend:
    name: Compilación del Frontend (React + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/frontend/package.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación React para producción
        run: npm run build
